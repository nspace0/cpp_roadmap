name: Obfuscate and Deploy Website

on:
  push:
    branches:
      - main # Укажи master, если твоя ветка называется так

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04 # Зафиксировали стабильную версию, чтобы не ловить новые предупреждения ОС
    steps:
      - name: Checkout private code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Исправили опечатку (было node-size) и обновили версию

      - name: Install Obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate JS files
        run: |
          # Скрипт шифрует JS код. Если у тебя только HTML/CSS — он просто пропустит этот шаг
          find . -name "*.js" -not -path "*/node_modules/*" -exec javascript-obfuscator {} --output {} \;

      - name: Push to Public Repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: '.'
          destination-github-username: 'nspace0'
          destination-repository-name: 'round'
          user-email: 'bulguchev2018@gmail.com'
          target-branch: 'main'
