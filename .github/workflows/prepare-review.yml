name: Build and verify review branch
on:
  push:
    branches: ['fix/gdb-live-and-progress-backup']
permissions:
  contents: read
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[prepare-review]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gdb-live-and-progress-backup
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed source
        run: |
          npm install --prefix source --ignore-scripts
          node source/build.mjs
          node learning/build.mjs
          npm run check --prefix source
          node --test learning/check.mjs learning/check-developer-courses.mjs learning/nms/books-check.cjs learning/radio-build/check.mjs learning/progress-backup/check.mjs
      - name: Install live debugging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdb gdbserver
      - name: Verify corrected live labs
        run: |
          python3 -m zipfile -e cpp-tools/labs.zip /tmp/roadmap-labs
          python3 learning/developer-labs/verify-live.py --labs /tmp/roadmap-labs/cpp-devtools-labs --output gdb-verification
      - name: Install isolated browsers
        working-directory: learning/progress-backup/browser
        run: npm ci && npx playwright install --with-deps chromium firefox
      - name: Verify browser transfer
        working-directory: learning/progress-backup/browser
        run: npm test
      - name: Save generated pages to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html C_CPP_Roadmap_Offline.html assembly astronomy cpp-tools development electronics history maps math physics radio-software radiotelescope ros learning/data/build-summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate reviewed pages and laboratory archive'
            git push origin HEAD:fix/gdb-live-and-progress-backup
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-verification
          path: |
            gdb-verification/
            learning/progress-backup/browser/results/
          retention-days: 30
